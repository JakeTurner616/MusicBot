name: Build and Test

on:
  push:
    branches:
      - stable
  pull_request:
    branches:
      - stable

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up JDK 11
        uses: actions/setup-java@v4.7.1
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Build and Test with Maven
        run: mvn clean package -U

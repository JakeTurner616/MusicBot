name: Release

permissions:
  contents: read
  id-token: write
  issues: write
  deployments: write
  actions: write
  checks: write
  packages: write
  statuses: write

on:
  workflow_dispatch:
    inputs:
      version_number:
        description: 'Version Number'
        required: true
        type: string
      info:
        description: 'Release description'
        required: false
        type: string

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the stable branch.
      - name: Checkout stable branch
        uses: actions/checkout@v2
        with:
          ref: stable

      # Step 2: Set up JDK 11.
      - name: Set up JDK 11
        uses: actions/setup-java@v2
        with:
          java-version: '11'
          distribution: 'adopt'
          cache: maven

      # Step 3: Update the version in pom.xml.
      - name: Update version in pom.xml
        run: |
          # This sed command assumes your current version is in the format: JMusicBot-<number>-stable
          # It replaces the trailing '-stable' with '-<version_number>' provided as input.
          sed -i "s/\(JMusicBot-[0-9.]*\)-stable/\1-${{ github.event.inputs.version_number }}/" pom.xml
          echo "Updated pom.xml version to include release version ${{ github.event.inputs.version_number }}"

      # Step 4: Build the project and run tests.
      - name: Build with Maven
        run: mvn clean package -U --batch-mode

      # Step 5: Rename the built jar.
      - name: Rename jar
        run: |
          # Locate the shaded jar. Adjust the pattern if needed.
          jar_file=$(ls target/*-All.jar | head -n 1)
          new_name="JMusicBot-${{ github.event.inputs.version_number }}.jar"
          mv "$jar_file" "$new_name"
          echo "Jar renamed to $new_name"
      
      # Step 6: Create the GitHub release.
      - name: Create GitHub Release
        id: create_release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.event.inputs.version_number }}
          name: "Version ${{ github.event.inputs.version_number }}"
          draft: false
          prerelease: false
          body: ${{ github.event.inputs.info }}

      # Step 7: Upload the jar as a release asset.
      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: "JMusicBot-${{ github.event.inputs.version_number }}.jar"
          asset_name: "JMusicBot-${{ github.event.inputs.version_number }}.jar"
          asset_content_type: application/java-archive
